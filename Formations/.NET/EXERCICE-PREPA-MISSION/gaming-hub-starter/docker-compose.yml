version: '3.8'

services:
  # SQL Server - Base de données
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gaming-hub-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=GamingHub123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P GamingHub123! -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Seq - Visualisation des logs
  seq:
    image: datalust/seq:latest
    container_name: gaming-hub-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped

volumes:
  sqlserver-data:
  seq-data:
